<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAP - Mental Health in the Community</title>
  <script src="https://minepi.com"></script>
  <script>
    Pi.init({ version: "2.0", sandbox: true });

    async function loginWithPi() {
      try {
        const scopes = ['username'];
        const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
        document.getElementById('status').innerText = "Connected as: @" + auth.user.username;
      } catch (err) {
        document.getElementById('status').innerText = "Error: " + err.message;
      }
    }

    function onIncompletePaymentFound(payment) {
      console.log("Incomplete payment:", payment);
    }
  </script>
</head>
<body>
  <h1>BAP: Mental Health in the Community</h1>
  <p id="status">Not connected to Pi yet.</p>
  <button onclick="loginWithPi()">Connect Pi Account</button>
</body>
</html>
